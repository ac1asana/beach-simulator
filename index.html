<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cozy Beach Simulator - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="appBody" class="flex flex-col justify-between items-center h-full w-full relative select-none font-['Fredoka']">

    <!-- Top Navigation / Status Bar -->
    <header class="w-full pt-safe px-4 pt-3 flex justify-between items-center z-30">
        <div class="bg-white px-3.5 py-1.5 rounded-full shadow border border-gray-300 flex items-center space-x-2">
            <span id="timeIcon" class="text-lg">☀️</span>
            <span id="timeLabel" class="text-sky-900 font-semibold text-xs sm:text-sm">Day Mode</span>
        </div>

        <div class="flex items-center space-x-2">
            <div class="bg-white px-3 py-1.5 rounded-full shadow border border-gray-300 flex items-center space-x-1.5">
                <span>🐚</span>
                <span id="shellCount" class="text-amber-700 font-bold text-xs sm:text-sm">0</span>
            </div>
            
            <button id="soundToggleBtn" class="bg-white active:scale-95 transition-all text-sky-800 p-2 rounded-full shadow border border-gray-300 flex items-center justify-center">
                <span id="soundIcon" class="text-base">🔇</span>
            </button>

            <button id="settingsBtn" class="bg-white active:scale-95 transition-all text-sky-800 p-2 rounded-full shadow border border-gray-300 flex items-center justify-center">
                <span class="text-base">⚙️</span>
            </button>
        </div>
    </header>

    <!-- Background Environment -->
    <div id="envContainer" class="absolute inset-0 z-20 flex flex-col transition-all duration-1000">
        <div id="skyZone" class="w-full h-[44%] bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100 relative overflow-hidden transition-all duration-1000 pointer-events-none">
            <div id="celestialBody" class="absolute top-8 right-12 w-16 h-16 bg-amber-300 rounded-full shadow-2xl transition-all duration-1000"></div>
            <div id="starsOverlay" class="absolute inset-0 opacity-0 transition-opacity duration-1000 pointer-events-none">
                <div class="absolute top-6 left-12 text-white text-xs">✨</div>
                <div class="absolute top-14 left-1/3 text-white text-sm">⭐</div>
            </div>
            <div class="absolute top-10 text-amber-900/30 text-xs tracking-widest">v v</div>
        </div>

        <div class="w-full h-[26%] relative bg-sky-400 transition-colors duration-1000 pointer-events-none" id="oceanZone">
            <canvas id="waveCanvas" class="absolute inset-0 w-full h-full block"></canvas>
        </div>

        <div id="sandZone" class="w-full h-[30%] bg-gradient-to-b from-amber-100 to-amber-200 relative shadow-inner transition-colors duration-1000">
            <div class="absolute top-4 left-12 w-4 h-2 bg-amber-300/60 rounded-full"></div>
        </div>
    </div>

    <!-- Main Interactive Scene -->
    <main class="relative z-30 flex-grow flex flex-col justify-center items-center w-full max-w-md px-4 pb-12 pointer-events-none">
        <div class="relative w-full flex justify-center items-end h-72 pointer-events-auto">
            
            <div id="umbrella" class="absolute -top-16 left-1/2 -translate-x-1/2 w-72 h-36 z-0 transition-transform duration-500">
                <div class="w-full h-28 bg-gradient-to-r from-rose-400 via-amber-200 to-rose-400 rounded-t-full shadow-xl relative overflow-hidden border-b-4 border-rose-600">
                    <div class="absolute inset-0 flex justify-around opacity-40">
                        <div class="w-8 h-full bg-rose-600"></div>
                        <div class="w-8 h-full bg-rose-600"></div>
                    </div>
                </div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-2.5 h-36 bg-amber-900 rounded-b shadow-md"></div>
            </div>

            <div id="fxContainer" class="absolute -top-10 left-1/2 -translate-x-1/2 z-40 pointer-events-none"></div>

            <div id="characterWrapper" class="relative z-30 flex flex-col items-center cursor-pointer transform transition-transform active:scale-95">
                <div class="absolute -bottom-4 w-56 h-8 bg-amber-800 rounded-md shadow-lg border-b-4 border-amber-950 flex justify-between px-3 items-center">
                    <div class="w-3 h-10 bg-amber-950 rounded-b -bottom-8 absolute left-4"></div>
                    <div class="w-3 h-10 bg-amber-950 rounded-b -bottom-8 absolute right-4"></div>
                </div>

                <div id="cartoonChar" class="relative flex flex-col items-center">
                    <div class="relative w-28 h-24 bg-amber-200 rounded-full shadow-md border-2 border-amber-800 flex flex-col items-center justify-center">
                        <div class="absolute -top-2 -left-2 w-8 h-8 bg-amber-300 rounded-full border-2 border-amber-800"></div>
                        <div class="absolute -top-2 -right-2 w-8 h-8 bg-amber-300 rounded-full border-2 border-amber-800"></div>
                        
                        <div class="flex space-x-2 items-center mt-1">
                            <div class="w-8 h-6 bg-slate-900 rounded-md border border-amber-900"></div>
                            <div class="w-8 h-6 bg-slate-900 rounded-md border border-amber-900"></div>
                        </div>

                        <div class="w-10 h-7 bg-amber-100 rounded-full mt-2 border border-amber-700/40 flex flex-col items-center justify-center">
                            <div class="w-3 h-2 bg-amber-900 rounded-full"></div>
                            <div id="smileLine" class="w-4 h-1.5 border-b-2 border-amber-900 rounded-full"></div>
                        </div>
                    </div>

                    <div class="relative w-32 h-20 bg-teal-400 rounded-t-3xl shadow-md border-2 border-teal-700 flex items-center justify-center -mt-3">
                        <div class="absolute right-2 -top-2 w-8 h-8 bg-amber-200 rounded-full border-2 border-amber-800 shadow flex items-center justify-center">
                            <div class="relative w-6 h-8 bg-amber-600 rounded-b-lg border border-amber-900 flex flex-col items-center overflow-hidden">
                                <div id="drinkLiquid" class="absolute bottom-0 w-full h-5 bg-pink-400 transition-colors duration-500"></div>
                            </div>
                        </div>
                        <div class="absolute left-2 top-2 w-7 h-7 bg-amber-200 rounded-full border-2 border-amber-800 shadow"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Control Bar -->
    <footer class="w-full pb-safe pb-4 px-4 z-30 flex flex-col items-center space-y-2 pointer-events-auto">
        <div class="w-full max-w-md bg-white p-3 rounded-2xl shadow-xl border border-gray-300 flex justify-around items-center">
            
            <button id="drinkMenuBtn" class="flex flex-col items-center space-y-1 active:scale-95 transition-all text-sky-900">
                <span class="text-2xl">🍹</span>
                <span class="text-[10px] font-semibold">Drinks</span>
            </button>

            <button id="weatherBtn" class="flex flex-col items-center space-y-1 active:scale-95 transition-all text-sky-900">
                <span id="weatherBtnIcon" class="text-2xl">🌅</span>
                <span id="weatherBtnLabel" class="text-[10px] font-semibold">Time</span>
            </button>

            <button id="umbrellaToggleBtn" class="flex flex-col items-center space-y-1 active:scale-95 transition-all text-sky-900">
                <span class="text-2xl">⛱️</span>
                <span class="text-[10px] font-semibold">Umbrella</span>
            </button>

            <button id="lofiToggleBtn" class="flex flex-col items-center space-y-1 active:scale-95 transition-all text-sky-900">
                <span id="lofiIcon" class="text-2xl">🎶</span>
                <span class="text-[10px] font-semibold">Lofi Chill</span>
            </button>
        </div>

        <div class="bg-white px-4 py-1.5 rounded-full shadow border border-gray-300">
            <p id="tipText" class="text-sky-900 text-xs font-medium text-center">✨ Tap character, sip drinks, & collect seashells! ✨</p>
        </div>
    </footer>

    <!-- Drink Selection Modal -->
    <div id="drinkModal" class="fixed inset-0 z-50 bg-black/40 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-gray-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-sky-900">🍹 Choose Your Drink</h3>
                <button id="closeDrinkModal" class="text-gray-400 text-xl font-bold px-2">✕</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button class="drink-option p-3 bg-rose-50 border border-rose-200 rounded-2xl flex items-center space-x-3 active:scale-95 transition text-left" data-name="Tropical Pink" data-color="#f43f5e" data-icon="🍹">
                    <span class="text-2xl">🍹</span>
                    <div><p class="font-bold text-sm text-rose-900">Tropical</p></div>
                </button>
                <button class="drink-option p-3 bg-sky-50 border border-sky-200 rounded-2xl flex items-center space-x-3 active:scale-95 transition text-left" data-name="Blue Lagoon" data-color="#0ea5e9" data-icon="🥤">
                    <span class="text-2xl">🥤</span>
                    <div><p class="font-bold text-sm text-sky-900">Lagoon</p></div>
                </button>
                <button class="drink-option p-3 bg-amber-50 border border-amber-200 rounded-2xl flex items-center space-x-3 active:scale-95 transition text-left" data-name="Sunny Citrus" data-color="#facc15" data-icon="🍊">
                    <span class="text-2xl">🍊</span>
                    <div><p class="font-bold text-sm text-amber-900">Citrus</p></div>
                </button>
                <button class="drink-option p-3 bg-emerald-50 border border-emerald-200 rounded-2xl flex items-center space-x-3 active:scale-95 transition text-left" data-name="Minty Breeze" data-color="#10b981" data-icon="🌿">
                    <span class="text-2xl">🌿</span>
                    <div><p class="font-bold text-sm text-emerald-900">Breeze</p></div>
                </button>   
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/40 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-gray-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-sky-900">⚙️ Beach Settings</h3>
                <button id="closeSettingsModal" class="text-gray-400 text-xl font-bold px-2">✕</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Wave Ocean Volume</label>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.35" class="w-full mt-1 accent-sky-500">
                </div>
                <div class="pt-2 border-t border-gray-100 flex justify-between items-center">
                    <span class="text-xs font-semibold text-gray-600">Seashells Collected</span>
                    <span id="statsShells" class="font-bold text-amber-600">0</span>
                </div>
                <div class="pt-2">
                    <button id="resetProgressBtn" class="w-full py-2.5 bg-rose-100 text-rose-700 rounded-xl font-bold text-xs">Reset All Progress</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Seashell Click Layer (Sits above everything so clicks never fail) -->
    <div id="shellSpawnArea" class="absolute inset-0 z-40 pointer-events-none"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
