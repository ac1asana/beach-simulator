```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Beach Simulator</title>
    <!-- Tailwind CSS loaded via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="appBody" class="flex flex-col justify-between items-center h-full w-full relative select-none font-['Fredoka']">

    <!-- Top Bar -->
    <header class="w-full px-4 pt-3 flex justify-between items-center z-30">
        <div class="bg-white px-3 py-1 rounded shadow border border-gray-300 flex items-center space-x-2">
            <span id="timeIcon">sun</span>
            <span id="timeLabel" class="text-sky-900 font-semibold text-sm">Day</span>
        </div>

        <div class="flex items-center space-x-2">
            <div class="bg-white px-3 py-1 rounded shadow border border-gray-300 flex items-center space-x-1">
                <span>shells:</span>
                <span id="shellCount" class="font-bold text-amber-700">0</span>
            </div>
            
            <button onclick="toggleAudio()" class="bg-white text-sky-800 px-3 py-1 rounded shadow border border-gray-300">
                <span id="soundIcon">sound off</span>
            </button>

            <button onclick="openMenu('settingsModal')" class="bg-white text-sky-800 px-3 py-1 rounded shadow border border-gray-300">
                <span>settings</span>
            </button>
        </div>
    </header>

    <!-- Background Environment -->
    <div id="envContainer" class="absolute inset-0 z-0 flex flex-col pointer-events-none">
        <div id="skyZone" class="w-full h-[44%] bg-sky-300 relative overflow-hidden">
            <div id="celestialBody" class="absolute top-8 right-12 w-16 h-16 bg-yellow-200 rounded-full"></div>
            <div id="starsOverlay" class="absolute inset-0 opacity-0 pointer-events-none">
                <div class="absolute top-6 left-12 text-white text-xs">.</div>
                <div class="absolute top-14 left-1/3 text-white text-sm">.</div>
            </div>
            <div class="absolute top-10 text-gray-500 text-xs">v v</div>
        </div>

        <div class="w-full h-[26%] relative bg-sky-400" id="oceanZone">
            <canvas id="waveCanvas" class="absolute inset-0 w-full h-full block"></canvas>
        </div>

        <div id="sandZone" class="w-full h-[30%] bg-amber-100 relative">
            <div id="shellSpawnArea" class="absolute inset-0 z-10 pointer-events-auto"></div>
            <div class="absolute top-4 left-12 w-4 h-2 bg-amber-200 rounded"></div>
        </div>
    </div>

    <!-- Main Scene -->
    <main class="relative z-10 flex-grow flex flex-col justify-center items-center w-full max-w-md px-4 pb-12">
        <div class="relative w-full flex justify-center items-end h-72">
            
            <!-- Umbrella -->
            <div id="umbrella" class="absolute -top-16 left-1/2 -translate-x-1/2 w-72 h-36 z-0">
                <div class="w-full h-28 bg-rose-400 rounded-t-full relative overflow-hidden border-b-4 border-rose-600">
                    <div class="absolute inset-0 flex justify-around opacity-40">
                        <div class="w-8 h-full bg-rose-600"></div>
                        <div class="w-8 h-full bg-rose-600"></div>
                    </div>
                </div>
                <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-2.5 h-36 bg-amber-900"></div>
            </div>

            <div id="fxContainer" class="absolute -top-10 left-1/2 -translate-x-1/2 z-30 pointer-events-none"></div>

            <!-- Character Wrapper -->
            <div id="characterWrapper" class="relative z-10 flex flex-col items-center cursor-pointer" onclick="interactCharacter()">
                
                <div class="absolute -bottom-4 w-56 h-8 bg-amber-800 rounded flex justify-between px-3 items-center">
                    <div class="w-3 h-10 bg-amber-950 -bottom-8 absolute left-4"></div>
                    <div class="w-3 h-10 bg-amber-950 -bottom-8 absolute right-4"></div>
                </div>

                <div id="cartoonChar" class="relative flex flex-col items-center">
                    <div class="relative w-28 h-24 bg-amber-200 rounded-full border-2 border-amber-800 flex flex-col items-center justify-center">
                        <div class="absolute -top-2 -left-2 w-8 h-8 bg-amber-300 rounded-full border border-amber-800"></div>
                        <div class="absolute -top-2 -right-2 w-8 h-8 bg-amber-300 rounded-full border border-amber-800"></div>
                        
                        <div class="flex space-x-2 items-center mt-1">
                            <div class="w-8 h-6 bg-black rounded"></div>
                            <div class="w-8 h-6 bg-black rounded"></div>
                        </div>

                        <div class="w-10 h-7 bg-amber-100 rounded-full mt-2 flex flex-col items-center justify-center">
                            <div class="w-3 h-2 bg-amber-900 rounded-full"></div>
                            <div id="smileLine" class="w-4 h-1.5 border-b-2 border-amber-900 rounded-full"></div>
                        </div>
                    </div>

                    <div class="relative w-32 h-20 bg-teal-400 rounded-t-3xl border-2 border-teal-700 flex items-center justify-center -mt-3">
                        <div class="absolute right-2 -top-2 w-8 h-8 bg-amber-200 rounded-full border-2 border-amber-800 flex items-center justify-center">
                            <div class="relative w-6 h-8 bg-amber-600 rounded-b-lg flex flex-col items-center overflow-hidden">
                                <div id="drinkLiquid" class="absolute bottom-0 w-full h-5 bg-pink-400"></div>
                            </div>
                        </div>
                        <div class="absolute left-2 top-2 w-7 h-7 bg-amber-200 rounded-full border-2 border-amber-800"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="w-full pb-4 px-4 z-30 flex flex-col items-center space-y-2">
        <div class="w-full max-w-md bg-white p-3 rounded shadow border border-gray-300 flex justify-around items-center">
            
            <button onclick="openMenu('drinkModal')" class="flex flex-col items-center text-sky-900">
                <span class="text-sm font-semibold">Drinks</span>
            </button>

            <button onclick="cycleWeather()" class="flex flex-col items-center text-sky-900">
                <span id="weatherBtnLabel" class="text-sm font-semibold">Time</span>
            </button>

            <button onclick="toggleUmbrella()" class="flex flex-col items-center text-sky-900">
                <span class="text-sm font-semibold">Umbrella</span>
            </button>

            <button onclick="toggleLofi()" class="flex flex-col items-center text-sky-900">
                <span class="text-sm font-semibold">Music</span>
            </button>
        </div>

        <div class="bg-white px-4 py-1 rounded shadow border border-gray-300">
            <p id="tipText" class="text-sky-900 text-xs text-center">Click character, pick drinks, collect shells.</p>
        </div>
    </footer>

    <!-- Drink Modal -->
    <div id="drinkModal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded p-6 shadow-xl border border-gray-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-sky-900">Choose Drink</h3>
                <button onclick="closeMenu('drinkModal')" class="font-bold">X</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="selectDrink('Tropical Pink', '#f43f5e', 'drink')" class="p-3 bg-gray-50 border rounded text-left">
                    <p class="font-bold text-sm">Tropical Punch</p>
                </button>
                <button onclick="selectDrink('Blue Lagoon', '#0ea5e9', 'drink')" class="p-3 bg-gray-50 border rounded text-left">
                    <p class="font-bold text-sm">Blue Lagoon</p>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded p-6 shadow-xl border border-gray-300">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-sky-900">Settings</h3>
                <button onclick="closeMenu('settingsModal')" class="font-bold">X</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-gray-700">Volume</label>
                    <input type="range" min="0" max="1" step="0.05" value="0.35" oninput="adjustVolume(this.value)" class="w-full mt-1">
                </div>
                <div>
                    <button onclick="resetProgress()" class="w-full py-2 bg-red-100 text-red-700 rounded font-bold text-xs">Reset Progress</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

```
